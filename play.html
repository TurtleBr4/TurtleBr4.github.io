<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18"><title>Play Game | Turtle.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .play-main{min-height:calc(100vh - 130px);padding:46px 7vw 70px;background:radial-gradient(ellipse at 50% 0%,#1a2044 0%,#080b18 60%)}.play-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.play-head h1{font-size:clamp(32px,5vw,58px);letter-spacing:-.06em;line-height:1.1;margin:0}.back-link{font:11px var(--mono);color:var(--cyan)}.game-shell{padding:10px;border:1px solid #344264;background:#050711;box-shadow:0 18px 70px #0005}.game-frame{width:100%;aspect-ratio:16/9;min-height:300px;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse,#1b2545,#080b18)}.game-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.empty-state{max-width:560px;padding:32px;text-align:center}.empty-symbol{font-size:42px;color:var(--cyan)}.empty-state h2{font-size:25px;margin:10px 0}.empty-state p{font-size:13px;color:var(--muted)}.play-controls{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;color:#929fbe;font:10px var(--mono);letter-spacing:.05em}.fullscreen-btn{border:0;background:var(--cyan);color:#07111b;padding:10px 13px;font:700 11px var(--mono);cursor:pointer}.play-description{max-width:750px;color:#b6bfd9;font-size:14px;margin-top:28px}@media(max-width:650px){.play-main{padding:35px 5vw 55px}.play-head{align-items:flex-start;flex-direction:column}.game-frame{aspect-ratio:4/3;min-height:250px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><span class="brand-star">✳</span> TURTLE<span class="brand-dim">.DEV</span></a><a class="back-link" href="index.html#projects">← ALL PROJECTS</a></header>
  <main class="play-main">
    <div class="play-head"><div><p class="eyebrow">BROWSER BUILD / UNITY WEB</p><h1 id="game-title">Loading game…</h1></div><a class="back-link" href="index.html#projects">BACK TO PORTFOLIO ↗</a></div>
    <div class="game-shell"><div class="game-frame" id="game-frame"><div class="empty-state"><div class="empty-symbol">✳</div><h2>Preparing the game</h2><p>Checking for a playable build…</p></div></div></div>
    <div class="play-controls"><span id="game-status">CHECKING BUILD</span><button id="fullscreen" class="fullscreen-btn">FULLSCREEN ↗</button><span>CLICK THE GAME TO FOCUS INPUT</span></div>
    <p class="play-description" id="game-description"></p>
  </main>
  <footer><a class="brand" href="index.html"><span class="brand-star">✳</span> TURTLE<span class="brand-dim">.DEV</span></a><span>PLAYER 01 <b>✦</b></span><a href="index.html#home">BACK TO TOP ↑</a></footer>
  <script>
    const gameId = new URLSearchParams(location.search).get("game");
    const frame = document.querySelector("#game-frame");
    const status = document.querySelector("#game-status");
    let gameFrame = null;
    fetch("projects.json").then(response => {
      if (!response.ok) throw new Error("projects.json not found");
      return response.json();
    }).then(projects => {
      const game = projects.find(item => item.id === gameId);
      if (!game) { showMessage("Project not found", "Return to the portfolio and select a project."); return; }
      document.title = "Play " + game.title + " | Turtle.dev";
      document.querySelector("#game-title").textContent = game.title;
      document.querySelector("#game-description").textContent = game.description || "";
      if (!game.webBuild) {
        showMessage("No browser build yet", "This project currently links to its external project page. Once you add a Unity Web build, set webBuild to true in projects.json.");
        status.textContent = "BUILD NOT CONFIGURED";
        return;
      }
      gameFrame = document.createElement("iframe");
      gameFrame.title = game.title + " Unity Web build";
      gameFrame.allow = "fullscreen; autoplay; gamepad";
      gameFrame.src = "games/" + encodeURIComponent(game.id) + "/index.html";
      gameFrame.addEventListener("error", () => status.textContent = "BUILD FAILED TO LOAD");
      frame.replaceChildren(gameFrame);
      status.textContent = "WEB BUILD · " + game.id.toUpperCase();
    }).catch(() => showMessage("Could not load project data", "Check that projects.json exists and is valid JSON."));
    function showMessage(title, message) {
      const box = document.createElement("div"); box.className = "empty-state";
      const symbol = document.createElement("div"); symbol.className = "empty-symbol"; symbol.textContent = "✳";
      const heading = document.createElement("h2"); heading.textContent = title;
      const paragraph = document.createElement("p"); paragraph.textContent = message;
      box.append(symbol, heading, paragraph); frame.replaceChildren(box); status.textContent = "NO BUILD LOADED";
    }
    document.querySelector("#fullscreen").addEventListener("click", () => {
      if (gameFrame && gameFrame.requestFullscreen) gameFrame.requestFullscreen();
      else if (frame.requestFullscreen) frame.requestFullscreen();
    });
  </script>
</body>
</html>
