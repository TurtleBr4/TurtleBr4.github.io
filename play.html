<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play a Game — Zaid Goodman</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .play-page { max-width: 1120px; margin: 0 auto; padding: 70px 32px; }
    .game-frame { width: 100%; aspect-ratio: 16/9; border: 1px solid var(--line); background: #171d27; }
    .game-frame iframe { width: 100%; height: 100%; border: 0; }
    .play-help { color: var(--muted); font-size: .9rem; margin-top: 18px; }
    @media(max-width:700px) { .play-page { padding: 45px 22px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html">ZAID GOODMAN<span>.</span></a>
    <a class="header-link" href="index.html#projects">← Back to projects</a>
  </header>
  <main class="play-page">
    <p class="eyebrow">GAME BUILD</p>
    <h1 id="game-title" style="font-size:clamp(2.5rem,6vw,4.5rem)">Play a game</h1>
    <div class="game-frame"><iframe id="game" title="Game player" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe></div>
    <p class="play-help" id="game-help">Select a project build by adding a game path to the URL, for example <code>play.html?game=games/example/index.html</code>.</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const gamePath = params.get("game");
    if (gamePath && !gamePath.startsWith("/") && !gamePath.includes("..")) {
      document.querySelector("#game").src = gamePath;
      document.querySelector("#game-title").textContent = params.get("title") || "Game build";
      document.querySelector("#game-help").textContent = "Use the game controls inside the player. Press F11 for a larger view.";
    }
  </script>
</body>
</html>
